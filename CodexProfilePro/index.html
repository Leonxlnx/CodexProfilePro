<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CodexProfilePro</title>
    <link rel="icon" href="./assets/profile.ico" sizes="any" />
    <link rel="apple-touch-icon" href="./assets/profile-icon.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="page-title">Profile</div>
      <nav class="top-actions" aria-label="Profile actions">
        <button id="shareProfileButton" class="ghost-action" type="button" aria-label="Share profile">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3v13" />
            <path d="m7 8 5-5 5 5" />
            <path d="M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5" />
          </svg>
          <span class="action-label">Share</span>
        </button>
        <button id="editProfileButton" class="ghost-action" type="button" aria-label="Edit profile">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m4.5 16.9-.7 3.3 3.3-.7L18.9 7.7a2 2 0 0 0 0-2.8l-.8-.8a2 2 0 0 0-2.8 0L4.5 16.9Z" />
            <path d="m14 5.4 4.2 4.2" />
          </svg>
          <span class="action-label">Edit</span>
        </button>
      </nav>
    </header>

    <main class="profile-shell">
      <section class="identity" aria-label="Profile identity">
        <div id="brandMark" class="brand-mark is-empty">
          <img id="profileAvatar" alt="" hidden />
          <span id="avatarFallback" aria-hidden="true">C</span>
        </div>
        <h1 id="profileName">Codex User</h1>
        <div id="handleRow" class="handle-row" hidden>
          <span id="profileHandle" hidden></span>
          <span id="profileDot" class="dot" hidden>.</span>
          <span id="profilePlan" class="plan-pill" hidden></span>
        </div>
      </section>

      <section class="metric-panel" aria-label="Profile stats">
        <div class="metric">
          <strong id="lifetimeTokens">...</strong>
          <span>Lifetime tokens</span>
        </div>
        <div class="metric">
          <strong id="peakTokens">...</strong>
          <span>Peak tokens</span>
        </div>
        <div class="metric">
          <strong id="longestTask">...</strong>
          <span>Longest task</span>
        </div>
        <div class="metric">
          <strong id="currentStreak">...</strong>
          <span>Current streak</span>
        </div>
        <div class="metric">
          <strong id="longestStreak">...</strong>
          <span>Longest streak</span>
        </div>
      </section>

      <section class="activity-card" aria-label="Token activity">
        <div class="activity-header">
          <h2>Token activity</h2>
          <div class="tabs" role="tablist" aria-label="Heatmap mode">
            <button class="tab is-active" type="button" data-mode="daily" role="tab" aria-selected="true">Daily</button>
            <button class="tab" type="button" data-mode="weekly" role="tab" aria-selected="false">Weekly</button>
            <button class="tab" type="button" data-mode="cumulative" role="tab" aria-selected="false">Cumulative</button>
            <button class="tab" type="button" data-mode="cost" role="tab" aria-selected="false">Cost</button>
          </div>
        </div>
        <div class="heatmap-wrap">
          <div id="heatmap" class="heatmap" aria-label="Daily token heatmap"></div>
          <div id="monthLabels" class="month-labels" aria-hidden="true"></div>
        </div>
        <div id="costSummary" class="cost-summary" hidden>
          <div class="cost-card">
            <strong id="totalCost">$0.00</strong>
            <span>Total estimated API cost</span>
          </div>
          <div class="cost-card">
            <strong id="monthCost">$0.00</strong>
            <span>This month</span>
          </div>
          <div class="cost-card">
            <strong id="peakCost">$0.00</strong>
            <span id="peakCostLabel">Peak cost day</span>
          </div>
          <div class="cost-card">
            <strong id="averageCost">$0.00</strong>
            <span>Avg active day</span>
          </div>
        </div>
      </section>
    </main>

    <button id="refreshButton" class="refresh-button" type="button" aria-label="Refresh data" title="Refresh data">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 6v5h-5" />
        <path d="M4 18v-5h5" />
        <path d="M18.2 9A7 7 0 0 0 6.8 6.2L4 9" />
        <path d="M5.8 15A7 7 0 0 0 17.2 17.8L20 15" />
      </svg>
      <span id="refreshLabel" class="refresh-label" aria-hidden="true"></span>
      <span class="sr-only">Refresh data</span>
    </button>

    <div id="profileDialog" class="dialog-backdrop" hidden>
      <section class="profile-dialog" role="dialog" aria-modal="true" aria-labelledby="profileDialogTitle">
        <div class="dialog-head">
          <h2 id="profileDialogTitle">Edit profile</h2>
          <button id="closeProfileDialog" class="icon-button" type="button" aria-label="Close profile editor">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 6l12 12" />
              <path d="M18 6 6 18" />
            </svg>
          </button>
        </div>
        <form id="profileForm" class="profile-form">
          <label>
            <span>Name</span>
            <input id="profileNameInput" name="name" autocomplete="name" maxlength="80" />
          </label>
          <label>
            <span>Handle</span>
            <input id="profileHandleInput" name="handle" autocomplete="username" maxlength="64" />
          </label>
          <label>
            <span>Plan</span>
            <input id="profilePlanInput" name="plan" maxlength="32" />
          </label>
          <label>
            <span>Profile image path or URL</span>
            <input id="profileAvatarInput" name="avatar" maxlength="2048" />
          </label>
          <div class="dialog-actions">
            <button id="chooseAvatarButton" class="secondary-action" type="button">Choose image</button>
            <button id="clearAvatarButton" class="secondary-action" type="button">Clear image</button>
            <button class="primary-action" type="submit">Save</button>
          </div>
        </form>
      </section>
    </div>

    <div id="shareDialog" class="dialog-backdrop" hidden>
      <section class="share-dialog" role="dialog" aria-modal="true" aria-labelledby="shareDialogTitle">
        <div class="dialog-head">
          <h2 id="shareDialogTitle">Share profile</h2>
          <button id="closeShareDialog" class="icon-button" type="button" aria-label="Close share preview">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 6l12 12" />
              <path d="M18 6 6 18" />
            </svg>
          </button>
        </div>
        <div class="share-preview-shell">
          <img id="sharePreview" class="share-preview" alt="Share card preview" />
        </div>
        <div class="share-status-row">
          <span id="shareStatus" class="share-status" aria-live="polite"></span>
        </div>
        <div class="dialog-actions">
          <button id="copyShareButton" class="secondary-action" type="button">Copy image</button>
          <button id="saveShareButton" class="primary-action" type="button">Save image</button>
        </div>
      </section>
    </div>

    <div id="tooltip" class="tooltip" role="status" aria-live="polite"></div>
    <script src="./app.js"></script>
  </body>
</html>
