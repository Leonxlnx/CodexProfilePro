name: Release

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            build: npm run dist:win
          - name: macos-universal
            os: macos-latest
            build: npm run dist:mac -- --universal
          - name: linux-x64
            os: ubuntu-latest
            build: npm run dist:linux

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: ${{ matrix.build }}
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: CodexProfilePro-${{ matrix.name }}
          path: |
            dist/**
            !dist/**/*.blockmap
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/CodexProfilePro*.exe
            dist/CodexProfilePro*.dmg
            dist/CodexProfilePro*.zip
            dist/*.AppImage
            dist/*.deb
